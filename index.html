<!DOCTYPE html>
<html lang="id" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneStore ERP & BMS - Business Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        body { font-family: 'Inter', sans-serif; }

        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col overflow-hidden transition-colors duration-200">

    <!-- Top Navbar -->

            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-slate-200 focus:outline-none lg:hidden p-1.5 rounded-lg hover:bg-slate-800">

            </button>
            <div class="flex items-center space-x-2.5">

                    <i class="fa-solid fa-mobile-screen-button text-lg"></i>
                </div>
                <div>
                    <span class="font-bold text-white tracking-tight text-base sm:text-lg">GadgetPro BMS</span>
                    <span class="hidden md:inline-block ml-2 px-2 py-0.5 text-[10px] font-semibold bg-indigo-950 text-indigo-300 rounded-full border border-indigo-800/60">ERP Pro (Dark Edition)</span>
                </div>
            </div>
        </div>

        <!-- Global Search & Quick Actions -->
        <div class="flex items-center space-x-3">
            <div class="relative hidden md:block w-64 lg:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="globalSearch" oninput="handleGlobalSearch(this.value)" placeholder="Cari produk, IMEI, pelanggan..." class="w-full pl-9 pr-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>

            <!-- Quick Add Dropdown Button -->
            <div class="relative">
                <button onclick="toggleQuickAddMenu()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span class="hidden sm:inline">Tambah Cepat</span>

                </button>
                <div id="quickAddMenu" class="absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl hidden z-50 py-1">

                    <button onclick="openModal('purchase', null); closeQuickAddMenu();" class="w-full text-left px-4 py-2.5 text-xs text-slate-200 hover:bg-slate-800 flex items-center space-x-2"><i class="fa-solid fa-cart-shopping text-emerald-400 w-4"></i><span>Pembelian Stok</span></button>
                    <button onclick="openModal('sale', null); closeQuickAddMenu();" class="w-full text-left px-4 py-2.5 text-xs text-slate-200 hover:bg-slate-800 flex items-center space-x-2"><i class="fa-solid fa-cash-register text-blue-400 w-4"></i><span>Penjualan</span></button>
                    <button onclick="openModal('expense', null); closeQuickAddMenu();" class="w-full text-left px-4 py-2.5 text-xs text-slate-200 hover:bg-slate-800 flex items-center space-x-2"><i class="fa-solid fa-receipt text-rose-400 w-4"></i><span>Pengeluaran</span></button>
                </div>

            <!-- User profile avatar -->

                    AD

                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout Container -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="absolute lg:relative inset-y-0 left-0 w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-20 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out shrink-0">
            <div class="p-4 overflow-y-auto flex-1 space-y-6">

                <div>
                    <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">Ringkasan</div>
                    <nav class="space-y-1">
                        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn active">

                            <span>Dashboard</span>

                    </nav>
                </div>

                <!-- Section: Manajemen Bisnis -->
                <div>
                    <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">Manajemen Bisnis</div>
                    <nav class="space-y-1">
                        <button onclick="switchTab('products')" id="nav-products" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">

                            <span>Produk & Inventaris</span>
                        </button>
                        <button onclick="switchTab('purchases')" id="nav-purchases" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">

                            <span>Pembelian</span>
                        </button>
                        <button onclick="switchTab('sales')" id="nav-sales" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">

                            <span>Penjualan</span>
                        </button>
                        <button onclick="switchTab('cashflow')" id="nav-cashflow" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">

                        </button>
                        <button onclick="switchTab('expenses')" id="nav-expenses" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">
                            <i class="fa-solid fa-receipt w-4 text-slate-400"></i>
                            <span>Pengeluaran</span>
                        </button>
                        <button onclick="switchTab('prive')" id="nav-prive" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">
                            <i class="fa-solid fa-user-shield w-4 text-slate-400"></i>
                            <span>Prive & Modal</span>
                        </button>
                        <button onclick="switchTab('warranties')" id="nav-warranties" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">
                            <i class="fa-solid fa-shield-halved w-4 text-slate-400"></i>
                            <span>Garansi & Komplain</span>
                        </button>
                    </nav>
                </div>

                <!-- Section: Analisis -->
                <div>
                    <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">Analisis</div>
                    <nav class="space-y-1">
                        <button onclick="switchTab('analytics')" id="nav-analytics" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">
                            <i class="fa-solid fa-chart-line w-4 text-slate-400"></i>
                            <span>Analitik & Laporan</span>
                        </button>
                    </nav>
                </div>

                <!-- Section: Kontak -->
                <div>
                    <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">Kontak</div>
                    <nav class="space-y-1">
                        <button onclick="switchTab('customers')" id="nav-customers" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">
                            <i class="fa-solid fa-users w-4 text-slate-400"></i>
                            <span>Pelanggan</span>
                        </button>
                        <button onclick="switchTab('suppliers')" id="nav-suppliers" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">
                            <i class="fa-solid fa-truck-field w-4 text-slate-400"></i>
                            <span>Supplier</span>
                        </button>
                    </nav>
                </div>

                <!-- Section: Sistem -->
                <div>
                    <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">Sistem</div>
                    <nav class="space-y-1">
                        <button onclick="switchTab('settings')" id="nav-settings" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">
                            <i class="fa-solid fa-gear w-4 text-slate-400"></i>
                            <span>Pengaturan</span>
                        </button>
                        <button onclick="switchTab('backup')" id="nav-backup" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition nav-btn">
                            <i class="fa-solid fa-database w-4 text-slate-400"></i>
                            <span>Cadangan Data</span>
                        </button>
                    </nav>
                </div>

            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-900/50">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span>Status Sistem</span>
                    <span class="flex items-center text-emerald-400 font-semibold"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1.5 animate-pulse"></span>Online</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-950 text-slate-100" id="mainContentArea">
            <!-- Dynamic Tab Views injected via JS -->
        </main>
    </div>

    <!-- Generic Modal Dialog -->
    <div id="appModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div id="modalContainer" class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl transform transition-all my-8">
            <!-- Dynamic Modal Content -->
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <!-- Application JavaScript Logic -->
    <script>
        // --- INITIAL STATE & LOCAL STORAGE ---
        const DEFAULT_STATE = {
            settings: {
                businessName: "GadgetPro Indonesia",
                owner: "Ahmad Fauzi",
                currency: "IDR",
                defaultWarrantyDays: 7,
                stockAgeWarning30: true,
                stockAgeWarning60: true,
                stockAgeWarning90: true
            },
            products: [
                { id: 'P001', name: 'Xiaomi 12T 8/256GB', category: 'Xiaomi', brand: 'Xiaomi', model: '12T', imei: '864201049281736', storage: '256GB', color: 'Cosmic Black', condition: 'Seperti Baru', buyPrice: 4200000, sellPrice: 5100000, purchaseDate: '2026-03-01', supplier: 'Global Cell Jakarta', status: 'Tersedia' },
                { id: 'P002', name: 'POCO X6 Pro 12/512GB', category: 'POCO', brand: 'POCO', model: 'X6 Pro', imei: '864201049281992', storage: '512GB', color: 'Yellow', condition: 'Baru', buyPrice: 4500000, sellPrice: 5350000, purchaseDate: '2026-02-10', supplier: 'Surya Phone', status: 'Tersedia' },
                { id: 'P003', name: 'Samsung Galaxy S21 FE', category: 'Samsung', brand: 'Samsung', model: 'S21 FE', imei: '356789012345678', storage: '128GB', color: 'Olive', condition: 'Bagus', buyPrice: 3800000, sellPrice: 4650000, purchaseDate: '2026-01-15', supplier: 'Bintang Jaya', status: 'Tersedia' },
                { id: 'P004', name: 'iPhone 12 128GB', category: 'Apple', brand: 'Apple', model: 'iPhone 12', imei: '352981109482716', storage: '128GB', color: 'Blue', condition: 'Seperti Baru', buyPrice: 5800000, sellPrice: 6890000, purchaseDate: '2025-11-20', supplier: 'iGadget Supplier', status: 'Tersedia' },
                { id: 'P005', name: 'Redmi Note 13 Pro', category: 'Xiaomi', brand: 'Xiaomi', model: 'Note 13 Pro', imei: '864920113847261', storage: '256GB', color: 'Purple', condition: 'Baru', buyPrice: 3100000, sellPrice: 3800000, purchaseDate: '2026-04-02', supplier: 'Global Cell Jakarta', status: 'Terjual' }
            ],
            purchases: [
                { id: 'TRX-P-01', date: '2026-04-02', supplier: 'Global Cell Jakarta', items: ['Redmi Note 13 Pro'], total: 3100000, status: 'Lunas', paymentMethod: 'Transfer Bank', notes: 'Pembelian stok perdana April' },
                { id: 'TRX-P-02', date: '2026-03-01', supplier: 'Global Cell Jakarta', items: ['Xiaomi 12T 8/256GB'], total: 4200000, status: 'Lunas', paymentMethod: 'Transfer Bank', notes: 'Kondisi mulus box lengkap' }
            ],
            sales: [
                { id: 'TRX-S-01', date: '2026-04-05', customer: 'Budi Santoso', productId: 'P005', productName: 'Redmi Note 13 Pro', sellPrice: 3800000, buyPrice: 3100000, directCost: 50000, extraFee: 25000, netProfit: 625000, status: 'Lunas', paymentMethod: 'QRIS', notes: 'Garansi aktif' }
            ],
            expenses: [
                { id: 'EXP-01', date: '2026-04-01', category: 'Operasional', description: 'Sewa Toko Bulan April', amount: 1500000, paymentMethod: 'Transfer Bank' },
                { id: 'EXP-02', date: '2026-04-03', category: 'Biaya Langsung', description: 'Ganti Anti Gores & Packing', amount: 75000, paymentMethod: 'Tunai' }
            ],
            prive: [
                { id: 'PRV-01', date: '2026-04-04', type: 'Penarikan Prive', description: 'Keperluan pribadi owner', amount: 1000000, paymentMethod: 'Transfer Bank' },
                { id: 'PRV-02', date: '2026-03-25', type: 'Penambahan Modal', description: 'Injeksi modal operasional toko', amount: 10000000, paymentMethod: 'Transfer Bank' }
            ],
            warranties: [
                { id: 'WAR-01', saleId: 'TRX-S-01', customer: 'Budi Santoso', product: 'Redmi Note 13 Pro', startDate: '2026-04-05', endDate: '2026-04-12', status: 'Selesai', complaint: 'Kamera berembun ringan', resolution: 'Perbaikan Selesai' }
            ],
            customers: [
                { id: 'CUST-01', name: 'Budi Santoso', phone: '081234567890', email: 'budi@gmail.com', address: 'Jl. Merdeka No. 12, Bandung', notes: 'Pelanggan VIP' },
                { id: 'CUST-02', name: 'Siti Aminah', phone: '085678901234', email: 'siti@gmail.com', address: 'Jl. Asia Afrika No. 45, Bandung', notes: 'Sering beli aksesoris' }
            ],
            suppliers: [
                { id: 'SUP-01', name: 'Global Cell Jakarta', contactPerson: 'Bpk. Hendra', phone: '081198765432', email: 'globalcell@gmail.com', address: 'ITC Roxy Mas Lt. 3 No. 12, Jakarta', notes: 'Supplier utama Android' },
                { id: 'SUP-02', name: 'iGadget Supplier', contactPerson: 'Ibu Rina', phone: '081388889999', email: 'igadget@gmail.com', address: 'Mangga Dua Square Lt. 2, Jakarta', notes: 'Supplier khusus Apple Second' }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('phoneStoreBMS')) || DEFAULT_STATE;
        let currentTab = 'dashboard';
        let currentChart = null;

        function saveData() {
            localStorage.setItem('phoneStoreBMS', JSON.stringify(appData));
        }

        function formatIDR(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold text-white flex items-center space-x-2 transition transform translate-y-2 opacity-0 border border-slate-700/50 ${type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-800' : 'bg-rose-950/90 text-rose-200 border-rose-800'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-rose-400'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function toggleQuickAddMenu() {
            const menu = document.getElementById('quickAddMenu');
            menu.classList.toggle('hidden');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-indigo-600/10', 'text-indigo-400', 'border', 'border-indigo-500/20'));
            const activeBtn = document.getElementById('nav-' + tabId);
            if (activeBtn) {
                activeBtn.classList.add('bg-indigo-600/10', 'text-indigo-400', 'border', 'border-indigo-500/20');
            }
            if (window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('mainContentArea');
            if (currentChart) { currentChart.destroy(); currentChart = null; }

            switch(currentTab) {
                case 'dashboard':
                    renderDashboard(container);
                    break;
                case 'products':
                    renderProducts(container);
                    break;
                case 'purchases':
                    renderPurchases(container);
                    break;
                case 'sales':
                    renderSales(container);
                    break;
                case 'cashflow':
                    renderCashflow(container);
                    break;
                case 'expenses':
                    renderExpenses(container);
                    break;
                case 'prive':
                    renderPrive(container);
                    break;
                case 'warranties':
                    renderWarranties(container);
                    break;
                case 'analytics':
                    renderAnalytics(container);
                    break;
                case 'customers':
                    renderCustomers(container);
                    break;
                case 'suppliers':
                    renderSuppliers(container);
                    break;
                case 'settings':
                    renderSettings(container);
                    break;
                case 'backup':
                    renderBackup(container);
                    break;
                default:
                    container.innerHTML = `<div class="text-slate-400">Modul sedang dimuat...</div>`;
            }
        }

        // --- DASHBOARD VIEW ---
        function renderDashboard(container) {
            const totalOmzet = appData.sales.reduce((acc, s) => acc + s.sellPrice, 0);
            const totalNetProfit = appData.sales.reduce((acc, s) => acc + s.netProfit, 0);
            const totalExpenses = appData.expenses.reduce((acc, e) => acc + e.amount, 0);
            
            const totalPrive = appData.prive.filter(p => p.type === 'Penarikan Prive').reduce((acc, p) => acc + p.amount, 0);
            const totalCapital = appData.prive.filter(p => p.type === 'Penambahan Modal').reduce((acc, p) => acc + p.amount, 0);
            const totalCashIn = totalOmzet + totalCapital;
            const totalCashOut = totalExpenses + totalPrive + appData.purchases.reduce((acc, p) => acc + p.total, 0);
            const cashBalance = totalCashIn - totalCashOut + 15000000; // initial baseline

            const availableStock = appData.products.filter(p => p.status === 'Tersedia');
            const totalCapitalStock = availableStock.reduce((acc, p) => acc + p.buyPrice, 0);
            const totalSellStock = availableStock.reduce((acc, p) => acc + p.sellPrice, 0);

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Dashboard Bisnis</h1>
                            <p class="text-xs text-slate-400">Ringkasan performa dan kondisi operasional ${appData.settings.businessName}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 font-medium">Periode: April 2026</span>
                            <button onclick="switchTab('analytics')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition shadow-lg shadow-indigo-600/20">Lihat Laporan Lengkap</button>
                        </div>
                    </div>

                    <!-- Financial Summary Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-sm">
                            <div class="flex items-center justify-between text-slate-400 mb-2">
                                <span class="text-xs font-medium">Total Omzet</span>
                                <i class="fa-solid fa-chart-line text-indigo-400"></i>

        function filterProductsTable() {
            const query = document.getElementById('productSearch').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const rows = document.querySelectorAll('#productsTable tbody tr');
            let count = 0;
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                const statusBadge = row.querySelector('td:nth-child(6)').innerText;
                const matchesQuery = text.includes(query);
                const matchesStatus = !statusFilter || statusBadge.includes(statusFilter);
                if (matchesQuery && matchesStatus) {
                    row.style.display = '';
                    count++;
                } else {
                    row.style.display = 'none';
                }
            });
            document.getElementById('productCount').innerText = count;
        }

                    <form onsubmit="handleExpenseSubmit(event)" class="space-y-3 text-xs">
                        <div><label class="block text-slate-300 mb-1">Kategori Pengeluaran</label><select id="eCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100"><option>Operasional</option><option>Biaya Langsung</option><option>Biaya Garansi</option><option>Lainnya</option></select></div>
                        <div><label class="block text-slate-300 mb-1">Deskripsi Pengeluaran</label><input type="text" id="eDesc" required placeholder="Contoh: Bayar listrik & internet toko" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-slate-300 mb-1">Jumlah (Rp)</label><input type="number" id="eAmount" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100"></div>
                            <div><label class="block text-slate-300 mb-1">Metode Pembayaran</label><select id="eMethod" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100"><option>Transfer Bank</option><option>Tunai</option><option>QRIS</option></select></div>
                        </div>
                        <div class="flex justify-end space-x-2 mt-4">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl hover:bg-slate-700">Batal</button>
                            <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/20">Simpan Pengeluaran</button>
                        </div>
                    </form>
                `;
            } else if (type === 'prive') {
                container.innerHTML = `
                    <h2 class="text-sm font-bold text-white mb-4">Catat Prive atau Penambahan Modal</h2>
                    <form onsubmit="handlePriveSubmit(event)" class="space-y-3 text-xs">
                        <div><label class="block text-slate-300 mb-1">Jenis Transaksi</label><select id="pType" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100"><option>Penarikan Prive</option><option>Penambahan Modal</option></select></div>
                        <div><label class="block text-slate-300 mb-1">Deskripsi Keterangan</label><input type="text" id="pDesc" required placeholder="Keperluan pribadi / injeksi kas" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-slate-300 mb-1">Jumlah (Rp)</label><input type="number" id="pAmount" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100"></div>
                            <div><label class="block text-slate-300 mb-1">Metode</label><select id="pMethod" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100"><option>Transfer Bank</option><option>Tunai</option></select></div>
                        </div>
                        <div class="flex justify-end space-x-2 mt-4">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl hover:bg-slate-700">Batal</button>
                            <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/20">Simpan Transaksi</button>
                        </div>
                    </form>
                `;
            }
        }

        function closeModal() {
            document.getElementById('appModal').classList.add('hidden');
        }

        function handleProductSubmit(e) {
            e.preventDefault();
            const newProd = {
                id: 'P00' + (appData.products.length + 1),
                name: document.getElementById('mName').value,
                category: document.getElementById('mCategory').value,
                brand: document.getElementById('mCategory').value,
                model: 'Standard',
                imei: document.getElementById('mImei').value,
                storage: '128GB',
                color: 'Default',
                condition: document.getElementById('mCondition').value,
                buyPrice: parseInt(document.getElementById('mBuy').value),
                sellPrice: parseInt(document.getElementById('mSell').value),
                purchaseDate: new Date().toISOString().slice(0, 10),
                supplier: 'Supplier Umum',
                status: 'Tersedia'
            };
            appData.products.push(newProd);
            saveData();
            closeModal();
            showToast('Produk baru berhasil ditambahkan!');
            renderCurrentView();
        }

        function handleSaleSubmit(e) {
            e.preventDefault();
            const prodId = document.getElementById('sProduct').value;
            const product = appData.products.find(p => p.id === prodId);
            if (!product) return;

            product.status = 'Terjual';
            const sellPrice = product.sellPrice;
            const buyPrice = product.buyPrice;
            const extraFee = parseInt(document.getElementById('sExtra').value) || 0;
            const netProfit = sellPrice - buyPrice - extraFee;

            const newSale = {
                id: 'TRX-S-0' + (appData.sales.length + 1),
                date: new Date().toISOString().slice(0, 10),
                customer: document.getElementById('sCustomer').value,
                productId: product.id,
                productName: product.name,
                sellPrice: sellPrice,
                buyPrice: buyPrice,
                directCost: 0,
                extraFee: extraFee,
                netProfit: netProfit,
                status: 'Lunas',
                paymentMethod: document.getElementById('sMethod').value,
                notes: 'Penjualan retail'
            };
            appData.sales.push(newSale);
            saveData();
            closeModal();
            showToast('Penjualan berhasil dicatat, stok diperbarui otomatis!');
            renderCurrentView();
        }

        function handleExpenseSubmit(e) {
            e.preventDefault();
            const newExp = {
                id: 'EXP-0' + (appData.expenses.length + 1),
                date: new Date().toISOString().slice(0, 10),
                category: document.getElementById('eCategory').value,
                description: document.getElementById('eDesc').value,
                amount: parseInt(document.getElementById('eAmount').value),
                paymentMethod: document.getElementById('eMethod').value
            };
            appData.expenses.push(newExp);
            saveData();
            closeModal();
            showToast('Pengeluaran berhasil dicatat!');
            renderCurrentView();
        }

        function handlePriveSubmit(e) {
            e.preventDefault();
            const newPrive = {
                id: 'PRV-0' + (appData.prive.length + 1),
                date: new Date().toISOString().slice(0, 10),
                type: document.getElementById('pType').value,
                description: document.getElementById('pDesc').value,
                amount: parseInt(document.getElementById('pAmount').value),
                paymentMethod: document.getElementById('pMethod').value
            };
            appData.prive.push(newPrive);
            saveData();
            closeModal();
            showToast('Transaksi prive / modal berhasil dicatat!');
            renderCurrentView();
        }

        function deleteProduct(id) {
            if (confirm('Apakah Anda yakin ingin menghapus produk ini?')) {
                appData.products = appData.products.filter(p => p.id !== id);
                saveData();
                showToast('Produk berhasil dihapus', 'error');
                renderCurrentView();
            }
        }

        function openProductDetail(id) {
            const product = appData.products.find(p => p.id === id);
            if (!product) return;
            const modal = document.getElementById('appModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('hidden');
            container.innerHTML = `
                <h2 class="text-sm font-bold text-white mb-3">Detail Produk: ${product.name}</h2>
                <div class="space-y-2 text-xs text-slate-300">
                    <div><strong>IMEI / Serial:</strong> ${product.imei}</div>
                    <div><strong>Kategori:</strong> ${product.category}</div>
                    <div><strong>Kondisi:</strong> ${product.condition} (${product.color})</div>
                    <div><strong>Harga Beli:</strong> ${formatIDR(product.buyPrice)}</div>
                    <div><strong>Harga Jual:</strong> ${formatIDR(product.sellPrice)}</div>
                    <div><strong>Status:</strong> <span class="px-2 py-0.5 bg-indigo-950 text-indigo-300 rounded">${product.status}</span></div>
                    <div><strong>Tanggal Masuk:</strong> ${product.purchaseDate}</div>
                </div>
                <div class="flex justify-end mt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl">Tutup</button>
                </div>
            `;
        }

        function handleGlobalSearch(query) {
            if (currentTab !== 'products') switchTab('products');
            setTimeout(() => {
                const searchInput = document.getElementById('productSearch');
                if (searchInput) {
                    searchInput.value = query;
                    filterProductsTable();
                }
            }, 50);
        }

        window.onload = function() {
            switchTab('dashboard');
        };
    </script>
</body>
</html>
